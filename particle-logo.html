<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Image Mask - Logo Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        .control-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(74, 246, 38, 0.2);
            border: 2px solid #4AF626;
            color: #4AF626;
            padding: 12px 24px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .control-button:hover {
            background: rgba(74, 246, 38, 0.4);
            box-shadow: 0 0 20px rgba(74, 246, 38, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <button class="control-button" onclick="restartAnimation()">Restart Animation</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let mouse = { x: null, y: null, radius: 80 };
        let animationPhase = 'entry';
        let animationFrame;
        let entryProgress = 0;
        let exitProgress = 0;
        let glitchTimer = 0;
        let idleTimer;

        // Particle class
        class Particle {
            constructor(x, y, rowIndex, totalRows) {
                this.baseX = x;
                this.baseY = y;
                // All particles start from top of screen at their X position
                this.x = x;
                this.y = -10; // Start even higher for longer fall
                this.size = 3; // Bigger particles for better visibility
                this.density = (Math.random() * 30) + 1;
                this.baseSize = 3;
                this.opacity = 0;
                this.color = '#2D8A1F'; // Darker, less bright green
                this.rowIndex = rowIndex;
                this.totalRows = totalRows;
                this.sparkleSpeed = Math.random() * 0.03 + 0.02;
                this.sparklePhase = Math.random() * Math.PI * 2;
                this.glitchOffsetX = 0;
                this.glitchOffsetY = 0;
                this.fallSpeed = 0; // Start with zero speed
                this.maxFallSpeed = Math.random() * 0.5 + 0.35; // Slower top speed
                this.acceleration = 0.035; // Very gentle acceleration for fluid motion
                this.fallDelay = Math.random() * 150; // Random delay 0-2.5 seconds (more particles visible)
                this.delayCounter = 0;
                this.hasLanded = false;
            }

            draw() {
                // Only draw particles that are visible (have started falling)
                if (this.delayCounter >= this.fallDelay || animationPhase !== 'entry') {
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = this.opacity;
                    ctx.beginPath();
                    ctx.arc(this.x + this.glitchOffsetX, this.y + this.glitchOffsetY, this.size, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            update() {
                // Repulse effect on hover
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < mouse.radius && mouse.x && animationPhase === 'idle') {
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let force = (mouse.radius - distance) / mouse.radius;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    // Snap back to position
                    if (Math.abs(this.x - this.baseX) > 0.1) {
                        this.x += (this.baseX - this.x) * 0.15;
                    }
                    if (Math.abs(this.y - this.baseY) > 0.1) {
                        this.y += (this.baseY - this.y) * 0.15;
                    }
                }

                // Animation phases
                if (animationPhase === 'entry') {
                    // Particles fall from above with smooth acceleration like raindrops
                    if (!this.hasLanded) {
                        // Wait for delay before starting to fall
                        if (this.delayCounter < this.fallDelay) {
                            this.delayCounter++;
                        } else {
                            // Make particle visible immediately when it starts falling
                            if (this.opacity === 0) {
                                this.opacity = 0.8;
                            }
                            
                            // Smoothly accelerate falling speed (gentle flow like water)
                            if (this.fallSpeed < this.maxFallSpeed) {
                                this.fallSpeed += this.acceleration;
                            }
                            
                            // Apply falling movement
                            this.y += this.fallSpeed;
                            this.opacity = Math.min(1, this.opacity + 0.01);

                            // Decelerate when approaching destination (smooth settling like water)
                            const distanceToTarget = this.baseY - this.y;
                            if (distanceToTarget < 160 && distanceToTarget > 0) {
                                this.fallSpeed *= 0.88; // Gradual slowdown for natural settling
                            }
                            
                            // Check if particle has reached its destination
                            if (this.y >= this.baseY) {
                                this.y = this.baseY;
                                this.hasLanded = true;
                                this.opacity = 1;
                                this.fallSpeed = 0;
                            }
                        }
                    }
                } else if (animationPhase === 'idle') {
                    // Sparkle effect
                    this.sparklePhase += this.sparkleSpeed;
                    this.opacity = 0.8 + Math.sin(this.sparklePhase) * 0.2;
                    this.size = this.baseSize + Math.sin(this.sparklePhase * 2) * 0.4;
                    this.glitchOffsetX = 0;
                    this.glitchOffsetY = 0;
                } else if (animationPhase === 'exit') {
                    // Glitch effect with displacement
                    if (glitchTimer % 3 === 0) {
                        this.glitchOffsetX = (Math.random() - 0.5) * 8;
                        this.glitchOffsetY = (Math.random() - 0.5) * 8;
                    }
                    
                    // Fade out from top to bottom
                    const rowExitProgress = exitProgress - ((this.totalRows - this.rowIndex) / this.totalRows) * 0.3;
                    if (rowExitProgress > 0) {
                        this.opacity = Math.max(0, 1 - rowExitProgress * 3);
                    }
                }
            }
        }

        // Create </> code symbol pattern - bigger and more aesthetic
        function init() {
            particles = [];
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const symbolSize = Math.min(canvas.width, canvas.height) * 1; // 80% of screen
            
            const gap = 20; // More spacing for pitch black gaps
            const thickness = 100; // Much thicker lines
            const particlesByRow = [];
            
            // Define the three parts: > \ <
            const rightAngle = symbolSize * 0.35;
            const slashWidth = symbolSize * 0.2;
            const leftAngle = symbolSize * 0.35;
            const totalWidth = rightAngle + slashWidth + leftAngle;
            const height = symbolSize * 0.6;
            
            const startX = centerX - totalWidth / 2;
            const startY = centerY - height / 2;
            
            let rowIndex = 0;
            for (let y = 0; y < height; y += gap) {
                const row = [];
                const actualY = startY + y;
                const progress = y / height; // 0 at top, 1 at bottom
                
                // RIGHT CHEVRON > (two lines meeting at middle-left)
                let rightCenterX;
                if (progress <= 0.5) {
                    rightCenterX = startX + (rightAngle * (1 - progress * 2));
                } else {
                    rightCenterX = startX + (rightAngle * ((progress - 0.5) * 2));
                }
                
                // Add thickness by creating multiple particles across the line width
                for (let offset = -thickness/2; offset <= thickness/2; offset += gap) {
                    row.push({ x: rightCenterX + offset, y: actualY });
                }
                
                // BACKSLASH \ (diagonal line from top-right to bottom-left)
                const slashCenterX = startX + rightAngle + (slashWidth * (1 - progress));
                
                for (let offset = -thickness/2; offset <= thickness/2; offset += gap) {
                    row.push({ x: slashCenterX + offset, y: actualY });
                }
                
                // LEFT CHEVRON < (two lines meeting at middle-right)
                const leftStart = startX + rightAngle + slashWidth;
                let leftCenterX;
                if (progress <= 0.5) {
                    leftCenterX = leftStart + (leftAngle * progress * 2);
                } else {
                    leftCenterX = leftStart + (leftAngle * (2 - progress * 2));
                }
                
                for (let offset = -thickness/2; offset <= thickness/2; offset += gap) {
                    row.push({ x: leftCenterX + offset, y: actualY });
                }
                
                if (row.length > 0) {
                    particlesByRow.push(row);
                }
                rowIndex++;
            }
            
            // Create particles with row information
            const totalRows = particlesByRow.length;
            particlesByRow.forEach((row, rowIdx) => {
                row.forEach(pos => {
                    particles.push(new Particle(pos.x, pos.y, rowIdx, totalRows));
                });
            });
            
            console.log(`Created ${particles.length} particles in ${totalRows} rows (>/< symbol)`);
            startEntryAnimation();
        }

        // Fallback if image-based approach was needed
        function initFromImage() {
            particles = [];
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = 'cpsquad/public/images/logo.png';
            
            img.onload = function() {
                console.log('✓ Image loaded successfully');
                const scale = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.6;
                const scaledWidth = img.width * scale;
                const scaledHeight = img.height * scale;
                const offsetX = (canvas.width - scaledWidth) / 2;
                const offsetY = (canvas.height - scaledHeight) / 2;

                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = scaledWidth;
                tempCanvas.height = scaledHeight;
                tempCtx.drawImage(img, 0, 0, scaledWidth, scaledHeight);
                
                const imageData = tempCtx.getImageData(0, 0, scaledWidth, scaledHeight);
                const pixels = imageData.data;
                
                const gap = 3;
                const particlesByRow = [];
                
                for (let y = 0; y < scaledHeight; y += gap) {
                    const row = [];
                    for (let x = 0; x < scaledWidth; x += gap) {
                        const index = (Math.floor(y) * scaledWidth + Math.floor(x)) * 4;
                        const alpha = pixels[index + 3];
                        
                        if (alpha > 10) {
                            const particleX = x + offsetX;
                            const particleY = y + offsetY;
                            row.push({ x: particleX, y: particleY });
                        }
                    }
                    if (row.length > 0) {
                        particlesByRow.push(row);
                    }
                }
                
                const totalRows = particlesByRow.length;
                particlesByRow.forEach((row, rowIndex) => {
                    row.forEach(pos => {
                        particles.push(new Particle(pos.x, pos.y, rowIndex, totalRows));
                    });
                });
                
                console.log(`Created ${particles.length} particles in ${totalRows} rows`);
                startEntryAnimation();
            };

            img.onerror = function() {
                console.error('❌ Error loading logo.png');
                console.error('Current directory: ' + window.location.href);
                console.error('Please place logo.png in the same folder as this HTML file');
                
                // Create a fallback text display
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '20px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('ERROR: logo.png not found', canvas.width / 2, canvas.height / 2);
                ctx.fillText('Place logo.png in: ' + window.location.href.split('/').slice(0, -1).join('/'), canvas.width / 2, canvas.height / 2 + 30);
            };
        }

        function animate() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update animation progress
            if (animationPhase === 'entry') {
                // Check if all particles have landed
                const allLanded = particles.every(p => p.hasLanded);
                if (allLanded) {
                    animationPhase = 'idle';
                    startIdleTimer();
                }
            } else if (animationPhase === 'exit') {
                exitProgress += 0.015;
                glitchTimer++;
                
                // Random color glitches
                if (glitchTimer % 2 === 0) {
                    const glitchColors = ['#4AF626', '#00FF00', '#39FF14', '#00FFFF', '#FF00FF', '#FFFF00', '#FF1493'];
                    particles.forEach(particle => {
                        if (Math.random() > 0.7) {
                            particle.color = glitchColors[Math.floor(Math.random() * glitchColors.length)];
                        }
                    });
                }
                
                if (exitProgress >= 1.3) {
                    restartAnimation();
                    return;
                }
            }
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            
            animationFrame = requestAnimationFrame(animate);
        }

        function startEntryAnimation() {
            animationPhase = 'entry';
            entryProgress = 0;
            exitProgress = 0;
            glitchTimer = 0;
            if (idleTimer) {
                clearTimeout(idleTimer);
            }
        }

        function startIdleTimer() {
            if (idleTimer) {
                clearTimeout(idleTimer);
            }
            idleTimer = setTimeout(() => {
                startExitAnimation();
            }, 12000);
        }

        function startExitAnimation() {
            animationPhase = 'exit';
            exitProgress = 0;
            glitchTimer = 0;
        }

        function restartAnimation() {
            cancelAnimationFrame(animationFrame);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (idleTimer) {
                clearTimeout(idleTimer);
            }
            init();
            animate();
        }

        // Mouse movement tracking
        canvas.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        canvas.addEventListener('mouseleave', function() {
            mouse.x = null;
            mouse.y = null;
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            restartAnimation();
        });

        // Start everything
        init();
        animate();
    </script>
</body>
</html>
