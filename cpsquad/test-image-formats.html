<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Image Format Tester</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0a0a0a;
            color: #fff;
        }
        h1 {
            color: #00FF41;
            text-align: center;
        }
        .input-section {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #00FF41;
            background: #0a0a0a;
            color: #fff;
            border-radius: 4px;
        }
        .formats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        .format-card {
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            transition: border-color 0.3s;
        }
        .format-card.success {
            border-color: #00FF41;
        }
        .format-card.error {
            border-color: #ff4141;
        }
        .format-title {
            font-weight: bold;
            color: #00FF41;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .format-url {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #888;
            word-break: break-all;
            margin-bottom: 15px;
            padding: 8px;
            background: #0a0a0a;
            border-radius: 4px;
        }
        .image-container {
            width: 100%;
            height: 200px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status.loading {
            background: #444;
            color: #fff;
        }
        .status.success {
            background: #00FF41;
            color: #000;
        }
        .status.error {
            background: #ff4141;
            color: #fff;
        }
    </style>
</head>
<body>
    <h1>🔍 Google Drive Image Format Tester</h1>
    
    <div class="input-section">
        <label for="fileId" style="display: block; margin-bottom: 10px; color: #00FF41;">
            Enter Google Drive File ID:
        </label>
        <input 
            type="text" 
            id="fileId" 
            placeholder="Paste file ID here (e.g., 15voWVyZ_oWKveyEgKKDovgo9vAEiJus4)"
            value="15voWVyZ_oWKveyEgKKDovgo9vAEiJus4"
        >
    </div>

    <div id="formatsContainer" class="formats-grid"></div>

    <script>
        const formats = [
            {
                name: 'LH3 (Current)',
                getUrl: (id) => `https://lh3.googleusercontent.com/d/${id}`
            },
            {
                name: 'LH3 with size',
                getUrl: (id) => `https://lh3.googleusercontent.com/d/${id}=s2000`
            },
            {
                name: 'Drive UC',
                getUrl: (id) => `https://drive.google.com/uc?export=view&id=${id}`
            },
            {
                name: 'Drive Thumbnail',
                getUrl: (id) => `https://drive.google.com/thumbnail?id=${id}&sz=w2000`
            },
            {
                name: 'Drive Usercontent',
                getUrl: (id) => `https://drive.usercontent.google.com/download?id=${id}&export=view&authuser=0`
            },
            {
                name: 'LH4',
                getUrl: (id) => `https://lh4.googleusercontent.com/d/${id}`
            }
        ];

        function testFormat(format, fileId) {
            const card = document.createElement('div');
            card.className = 'format-card';
            card.innerHTML = `
                <div class="format-title">${format.name}</div>
                <div class="format-url">${format.getUrl(fileId)}</div>
                <div class="image-container">
                    <img src="${format.getUrl(fileId)}" alt="Test image">
                </div>
                <div class="status loading">⏳ Loading...</div>
            `;

            const img = card.querySelector('img');
            const status = card.querySelector('.status');

            img.onload = () => {
                status.textContent = `✅ SUCCESS - Loaded in ${performance.now() / 1000}s`;
                status.className = 'status success';
                card.classList.add('success');
            };

            img.onerror = (e) => {
                status.textContent = `❌ FAILED - Could not load image`;
                status.className = 'status error';
                card.classList.add('error');
                console.error(`Failed to load ${format.name}:`, e);
            };

            return card;
        }

        function runTests() {
            const fileId = document.getElementById('fileId').value.trim();
            const container = document.getElementById('formatsContainer');
            container.innerHTML = '';

            if (!fileId) {
                alert('Please enter a file ID');
                return;
            }

            console.log('Testing file ID:', fileId);
            formats.forEach(format => {
                container.appendChild(testFormat(format, fileId));
            });
        }

        // Auto-run on load
        runTests();

        // Re-run on input change
        document.getElementById('fileId').addEventListener('input', (e) => {
            clearTimeout(window.testTimeout);
            window.testTimeout = setTimeout(runTests, 500);
        });
    </script>
</body>
</html>
